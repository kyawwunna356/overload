<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overload logo mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page:#0e0f0c; --card:#1a1c18; --raised:#23261f; --line:#2c2f29;
    --ink:#f2f4ef; --body:#b9bdb4; --mute:#868685;
    --lime:#9fe870; --on-lime:#0e0f0c; --pale:#1f3a12; --ink-deep:#cdffad;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#050604; color:var(--ink); font:15px/1.4 Inter, -apple-system, system-ui, sans-serif; }
  header { max-width:1180px; margin:0 auto; padding:40px 16px 8px; display:flex; align-items:center; gap:16px; }
  header img { width:56px; height:56px; border-radius:13px; }
  header h1 { margin:0; font-size:26px; letter-spacing:-0.02em; }
  header p { margin:2px 0 0; color:var(--body); }
  .grid { max-width:1180px; margin:0 auto; padding:24px 16px 64px; display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:40px 28px; justify-items:center; }
  figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:14px; }
  figcaption { color:var(--body); font-size:13px; text-align:center; max-width:300px; }
  figcaption b { color:var(--ink); font-weight:600; display:block; font-size:14px; }

  /* A phone frame, sized like an iPhone at half scale */
  .phone { width:300px; height:620px; border-radius:48px; background:#000; padding:10px; box-shadow:0 0 0 2px #2a2c28, 0 30px 60px rgba(0,0,0,.6); position:relative; }
  .screen { width:100%; height:100%; border-radius:39px; overflow:hidden; position:relative; background:var(--page); }
  .island { position:absolute; top:12px; left:50%; transform:translateX(-50%); width:88px; height:26px; border-radius:20px; background:#000; z-index:5; }
  .status { height:48px; display:flex; justify-content:space-between; align-items:center; padding:6px 28px 0; font-size:13px; font-weight:600; }

  /* 1. Home Screen */
  .wall { background:radial-gradient(120% 80% at 30% 10%, #2b3a2a 0%, #141a14 45%, #070907 100%); }
  .apps { display:grid; grid-template-columns:repeat(4, 1fr); gap:18px 0; padding:22px 14px; justify-items:center; }
  .app { display:flex; flex-direction:column; align-items:center; gap:5px; width:60px; }
  .app i { width:54px; height:54px; border-radius:13px; display:block; background:#3a3d38; }
  .app img { width:54px; height:54px; border-radius:13px; display:block; }
  .app span { font-size:10px; color:#fff; white-space:nowrap; }
  .dock { position:absolute; left:10px; right:10px; bottom:12px; height:76px; border-radius:28px; background:rgba(255,255,255,.14); backdrop-filter:blur(12px); display:flex; justify-content:space-around; align-items:center; }
  .dock i { width:54px; height:54px; border-radius:13px; background:#4a4d47; display:block; }

  /* 2. Launch */
  .launch { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:18px; }
  .launch img { width:132px; height:132px; border-radius:30px; }
  .launch strong { font-size:26px; letter-spacing:-0.03em; }
  .launch small { color:var(--mute); position:absolute; bottom:34px; }

  /* 3. Welcome card (board, first run) */
  .pad { padding:4px 16px; }
  .date { display:flex; justify-content:space-between; align-items:baseline; padding:6px 4px 14px; }
  .date b { font-size:26px; letter-spacing:-0.02em; }
  .date span { color:var(--lime); font-weight:600; }
  .week { display:flex; justify-content:space-between; padding:0 2px 22px; }
  .week div { width:32px; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10px; color:var(--mute); }
  .week i { width:28px; height:28px; border-radius:50%; background:var(--card); display:block; }
  .card { background:var(--card); border-radius:24px; }
  .welcome { padding:26px 20px 18px; text-align:center; display:flex; flex-direction:column; align-items:center; }
  .welcome img { width:64px; height:64px; border-radius:16px; }
  .welcome h3 { margin:16px 0 4px; font-size:21px; letter-spacing:-0.02em; }
  .welcome p { margin:0; color:var(--body); font-size:13px; }
  .btn { margin-top:18px; height:46px; width:100%; border-radius:999px; background:var(--lime); color:var(--on-lime); font-weight:600; display:flex; align-items:center; justify-content:center; }
  .tabs { position:absolute; bottom:0; left:0; right:0; height:78px; background:var(--page); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding-top:12px; font-size:10px; color:var(--mute); }
  .tabs div { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .tabs i { width:22px; height:22px; border-radius:6px; background:var(--line); display:block; }
  .tabs .on { color:var(--lime); }
  .tabs .on i { background:var(--lime); }

  /* 4. Me tab */
  .me h2 { font-size:26px; margin:6px 4px 16px; letter-spacing:-0.02em; }
  .rows { overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:14px 16px; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row .g { width:36px; height:36px; border-radius:12px; background:var(--page); flex:none; }
  .row div { flex:1; }
  .row small { display:block; color:var(--body); font-size:12px; }
  .about { margin-top:14px; padding:16px; display:flex; align-items:center; gap:14px; }
  .about img { width:48px; height:48px; border-radius:12px; }
  .about small { color:var(--body); display:block; font-size:12px; }

  /* 5. Browser tab */
  .browser { width:340px; border-radius:14px; overflow:hidden; background:#202124; box-shadow:0 20px 40px rgba(0,0,0,.5); }
  .bar { display:flex; align-items:flex-end; gap:6px; padding:10px 10px 0; background:#2b2c2f; }
  .dots { display:flex; gap:6px; padding:0 8px 12px 2px; }
  .dots i { width:10px; height:10px; border-radius:50%; background:#5f6163; display:block; }
  .tab { display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:10px 10px 0 0; background:#202124; font-size:12px; min-width:150px; }
  .tab img { width:16px; height:16px; border-radius:3px; }
  .tab.off { background:transparent; color:#9aa0a6; min-width:0; }
  .tab.off i { width:16px; height:16px; border-radius:3px; background:#5f6163; display:block; }
  .url { margin:8px 10px 10px; padding:8px 12px; border-radius:999px; background:#2b2c2f; color:#bdc1c6; font-size:12px; }
  .page { height:150px; background:var(--page); display:flex; align-items:center; justify-content:center; gap:10px; }
  .page img { width:36px; height:36px; border-radius:9px; }
  .page b { font-size:20px; letter-spacing:-0.02em; }

  /* 6. Add to Home Screen sheet */
  .share { position:absolute; left:0; right:0; bottom:0; background:#1c1c1e; border-radius:18px 18px 0 0; padding:14px 16px 30px; }
  .share .top { display:flex; justify-content:space-between; font-size:14px; color:#0a84ff; padding-bottom:16px; }
  .share .top b { color:#fff; }
  .share .item { display:flex; gap:12px; align-items:center; background:#2c2c2e; border-radius:12px; padding:12px; }
  .share .item img { width:58px; height:58px; border-radius:13px; }
  .share .item div { flex:1; border-bottom:1px solid #3a3a3c; padding-bottom:6px; font-size:15px; }
  .share .item small { display:block; color:#8e8e93; font-size:11px; padding-top:4px; }
  .dim { position:absolute; inset:0; background:rgba(0,0,0,.55); }

  /* 7. Icon sizes */
  .sizes { display:flex; align-items:flex-end; gap:22px; padding:30px 26px; border-radius:24px; background:var(--card); }
  .sizes div { display:flex; flex-direction:column; align-items:center; gap:8px; font-size:11px; color:var(--mute); }
  .sizes img { display:block; }
</style>
</head>
<body>

  <img data-logo alt="Overload logo">
